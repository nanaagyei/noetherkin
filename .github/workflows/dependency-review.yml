name: Dependency review

on:
  pull_request:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Explain unavailable private-repository review
        if: github.event.repository.private
        run: echo "::notice title=Dependency review unavailable::GitHub Dependency Review requires GitHub Code Security for private repositories. The CI dependency audit remains active."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event.repository.private == false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        if: github.event.repository.private == false
        with:
          fail-on-severity: moderate
          # Apache-2.0 is the outbound license. Strong copyleft in the dependency
          # graph would make redistribution of the packaged tool inconsistent with
          # that grant, so it fails the review rather than being discovered later.
          deny-licenses: AGPL-1.0-only, AGPL-1.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later, GPL-2.0-only, GPL-2.0-or-later, GPL-3.0-only, GPL-3.0-or-later, SSPL-1.0
