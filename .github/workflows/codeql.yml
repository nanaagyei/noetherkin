name: CodeQL

on:
  push:
    branches: [main, release/dev]
  pull_request:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: JavaScript and TypeScript
    runs-on: ubuntu-latest
    steps:
      - name: Explain unavailable private-repository scan
        if: github.event.repository.private
        run: echo "::notice title=Code scanning unavailable::GitHub Code Scanning is not enabled for this private repository. CodeQL will activate automatically when the repository becomes public."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event.repository.private == false
      - uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        if: github.event.repository.private == false
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        if: github.event.repository.private == false
        with:
          category: /language:javascript-typescript
