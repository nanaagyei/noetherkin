name: Release

# Every push to main is considered for a release (ADR-018). The merged pull request's release label decides the
# bump: release:major, release:minor, release:patch or release:none. With no pull request, Conventional Commit
# subjects since the last tag decide. Tags are the version source of truth: the version is stamped into the
# package at release time, verified, packed, and attached to a new GitHub release (ADR-017). Learners install with
#   npm install -g https://github.com/nanaagyei/noetherkin/releases/latest/download/noetherkin.tgz
# Nothing is published to npm (ACP-012).
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump; auto reads the release label or commit messages
        type: choice
        options: [auto, patch, minor, major]
        default: auto

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    name: Plan the release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
      bump: ${{ steps.plan.outputs.bump }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BUMP: ${{ inputs.bump || 'auto' }}
        run: node scripts/release-plan.mjs

  verify:
    name: Verify release candidate
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: npm install --global npm@11.9.0
      - run: npm ci --ignore-scripts
      - run: python -m pip install --requirement requirements-validation.txt
      - name: Stamp the planned version into the package
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version
      - run: npm run release:check
      - run: npm audit --audit-level=high
      - run: npm pack --ignore-scripts --json > package-output.json
      - run: node scripts/check-package.mjs package-output.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate
          path: |
            noetherkin-*.tgz
            package-output.json
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish the GitHub release
    needs: [plan, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate
      - name: Tag, release and attach versioned and stable-named tarballs with checksums
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
          BUMP: ${{ needs.plan.outputs.bump }}
        run: |
          set -euo pipefail
          versioned="noetherkin-$VERSION.tgz"
          test -f "$versioned"
          cp "$versioned" noetherkin.tgz
          sha256sum "$versioned" > "$versioned.sha256"
          sha256sum noetherkin.tgz > noetherkin.tgz.sha256
          gh release create "v$VERSION" "$versioned" "$versioned.sha256" noetherkin.tgz noetherkin.tgz.sha256 \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "v$VERSION" --generate-notes \
            --notes "Release type: $BUMP. Install: \`npm install -g https://github.com/$GITHUB_REPOSITORY/releases/latest/download/noetherkin.tgz\`"
