name: Release npm package

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify release candidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: npm install --global npm@11.9.0
      - run: npm ci --ignore-scripts
      - run: python -m pip install --requirement requirements-validation.txt
      - name: Verify release tag
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: node -e "const p=require('./package.json'); if(process.env.RELEASE_TAG !== 'v'+p.version){throw new Error('Release tag must equal v'+p.version)}"
      - run: npm run release:check
      - run: npm audit --audit-level=high
      - run: npm pack --ignore-scripts --json > package-output.json
      - run: node scripts/check-package.mjs package-output.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate
          path: |
            noetherkin-*.tgz
            package-output.json
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish to npm
    if: github.event_name == 'release'
    needs: verify
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@11.9.0
      - run: npm publish noetherkin-*.tgz --access public
