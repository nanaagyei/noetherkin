{
  "schema_version": "1.0",
  "data_class": "live",
  "id": "drift-monitor",
  "name": "Drift Monitor",
  "description": "A batch monitor for a deployed model that compares live inputs and predictions against a reference window, tracks performance as delayed labels arrive, and alerts in a way that separates drift, missing labels and pipeline faults.",
  "status": "draft",
  "track_alignment": [
    "ml-engineering",
    "ai-engineering"
  ],
  "competencies": [
    "ml.data-pipelines",
    "python.language",
    "core.testing",
    "core.git",
    "data.quality",
    "python.testing",
    "core.implementation",
    "ml.model-lifecycle",
    "production.metrics",
    "production.observability",
    "core.technical-communication",
    "core.ownership"
  ],
  "recommended_minimum_level": "E1",
  "ideal_level": "E2",
  "primary_languages": [
    "Python"
  ],
  "technologies": [
    "Standard library",
    "pytest"
  ],
  "external_services": [],
  "problem": "A deployed model's inputs shift over time and its accuracy decays, but the labels that would show the decay arrive days or weeks later. In the meantime the dashboard shows the last known accuracy and looks healthy. When something is finally noticed, nobody can tell whether the inputs drifted, the model degraded, the labels simply have not arrived, or an upstream pipeline started sending malformed data. Each needs a different response, and a monitor that cannot tell them apart either pages constantly or never.",
  "users": [
    {
      "who": "Someone operating a deployed model",
      "needs": "To learn early that inputs or predictions have shifted, and to know whether performance is actually known yet."
    },
    {
      "who": "An on-call responder woken by an alert",
      "needs": "To decide from the alert and the runbook whether this is drift, a label delay or a pipeline fault, and what to do next."
    }
  ],
  "success_criteria": [
    {
      "id": "SC-1",
      "criterion": "A reference window and live batches share a declared schema, and a malformed batch is refused with the offending column and rows named, never scored.",
      "verifiable_by": "Submit a batch with a missing column. The monitor refuses it, names the column, and records no drift result."
    },
    {
      "id": "SC-2",
      "criterion": "Each feature and the prediction distribution get a drift statistic chosen and justified by the learner (for example PSI or a KS statistic), with thresholds declared as data rather than code.",
      "verifiable_by": "Shift one synthetic feature. Only that feature crosses its threshold, and changing the threshold file changes the verdict with no code change."
    },
    {
      "id": "SC-3",
      "criterion": "Performance is computed only over predictions whose labels have arrived, with label coverage reported alongside it, and \"no labels yet\" is a distinct state from \"healthy\".",
      "verifiable_by": "Run a period with no labels. The monitor reports performance as unknown with zero coverage, not as the last known value."
    },
    {
      "id": "SC-4",
      "criterion": "Alerts distinguish input drift, prediction drift, performance degradation, missing labels and a malformed batch, and each names the evidence behind it.",
      "verifiable_by": "Replay the bundled synthetic incident. The alerts raised match the injected causes, in order."
    },
    {
      "id": "SC-5",
      "criterion": "An alert runbook tells a responder what each alert means and what to check first.",
      "verifiable_by": "Give a responder an alert from the replay and the runbook alone. They choose the correct first action."
    },
    {
      "id": "SC-6",
      "criterion": "Someone who did not write it can run the synthetic incident replay and read the resulting alerts using only the README.",
      "verifiable_by": "Hand the repository to another person with only the README. They run the replay and explain the alerts."
    }
  ],
  "non_goals": [
    "Training, retraining or serving a model. Predictions are supplied as data or by a pluggable function.",
    "A time-series database, streaming system or dashboard service.",
    "Automatic remediation such as rollback or retraining. The monitor informs a human decision.",
    "Causal attribution of drift to upstream systems.",
    "Real production data. Every batch is synthetic and generated by the learner."
  ],
  "operational_requirements": {
    "failure_modes": [
      {
        "failure": "A live batch is malformed: a missing column, a wrong type, or values outside the declared domain.",
        "required_behavior": "Refuse the batch, name the column and rows, raise a pipeline-fault alert, and never compute drift over it."
      },
      {
        "failure": "Labels have not arrived for a period.",
        "required_behavior": "Report performance as unknown with its label coverage, raise a missing-labels state if the delay exceeds the declared expectation, and never report the last known value as current."
      },
      {
        "failure": "A batch is too small for the drift statistic to be meaningful.",
        "required_behavior": "Report the statistic as not evaluated with the reason, and do not alert on it."
      },
      {
        "failure": "The same batch is submitted twice.",
        "required_behavior": "Detect the duplicate by batch identity and do not double-count it in drift or performance."
      }
    ],
    "observability": [
      "A one-line summary per batch with the batch identity, row count, features over threshold, and current label coverage.",
      "Per-feature drift statistics and thresholds recorded for every evaluated batch.",
      "Alerts recorded with their kind, the evidence behind them, and the batch or period they cover."
    ],
    "rollback": "Monitoring results and alerts are appended per batch and never rewritten, so there is no state to undo. A wrong threshold is fixed by changing the threshold file and replaying the affected batches, which produces new results beside the old ones. The operations note states how to replay and that deleting results removes the only record of what was alerted and why.",
    "documentation": [
      "A README quickstart that replays the bundled synthetic incident and shows the alerts in under a minute.",
      "An alert runbook that explains each alert kind, its evidence and the first thing to check.",
      "An operations note covering a malformed batch, a label delay, and replaying after a threshold change."
    ]
  },
  "context_budget": {
    "source_tokens_target": 16000,
    "excludes": [
      "tests",
      "lockfiles",
      "generated files",
      "the synthetic batch generator output"
    ],
    "rationale": "Batch validation, drift statistics, delayed-label tracking and alerting are each small. A budget near Eval Ledger's keeps the monitor from growing into a metrics platform. This is a starting target to revise against ACP-016 measurements."
  },
  "prerequisites": [
    "Can write and test a Python module with a virtual environment and a test runner.",
    "Can read and write CSV or JSON data files.",
    "Knows what a histogram and a classification accuracy are."
  ],
  "task_packs": [
    "drift-monitor-core"
  ],
